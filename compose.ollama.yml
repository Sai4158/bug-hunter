# Optional Ollama only. Streamlit/Pylint/pytest use the native project .venv.
# Do not start this on a port already occupied by native or shared Docker Ollama.
services:
  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.35.1}
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
volumes:
  ollama-data:
