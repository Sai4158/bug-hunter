name: Bug Hunter CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bug-hunter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.12'
            interpreter: .venv/Scripts/python.exe
          - os: macos-latest
            python: '3.12'
            interpreter: .venv/bin/python
          - os: ubuntu-latest
            python: '3.12'
            interpreter: .venv/bin/python
          - os: ubuntu-latest
            python: '3.11'
            interpreter: .venv/bin/python
    env:
      OLLAMA_BASE_URL: http://127.0.0.1:1
      PYTHONUTF8: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Select Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install pinned dependencies into project environment
        run: python setup_env.py
      - name: Run full regression suite (mocked AI, no model download)
        run: ${{ matrix.interpreter }} -m pytest -q --junitxml=test-results/junit.xml
      - name: Compile Python
        run: ${{ matrix.interpreter }} -m compileall -q app.py launch.py setup_env.py control.py bug_hunter evaluation tests
      - name: Check dependency consistency
        run: ${{ matrix.interpreter }} -m pip check
      - name: Check whitespace
        run: git diff --check
      - name: Check Unix launch helper syntax
        if: runner.os != 'Windows'
        run: bash -n setup.sh run.sh start.sh stop.sh
      - name: Check PowerShell helper syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($path in @('control.ps1', 'run.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { $parseErrors | Format-List; exit 1 }
          }
      - name: Preserve actual test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-${{ matrix.os }}-python-${{ matrix.python }}
          path: test-results/junit.xml
          if-no-files-found: warn
